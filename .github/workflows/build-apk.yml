name: Build & Release OskarSMS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/OskarSMS-v1.1.5-release.apk
          cp app/build/outputs/apk/release/app-release.apk release-output/OskarSMS.apk
          echo "APK successfully built and signed at release-output/OskarSMS-v1.1.5-release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OskarSMS-v1.1.5-APK
          path: release-output/OskarSMS-v1.1.5-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.1.5
          name: "OskarSMS v1.1.5 — New Notification Bar Icon & In-App OTA Update Test"
          body: |
            ### 📱 OskarSMS v1.1.5 — New Notification Bar Icon & In-App OTA Update Test

            **What's New in v1.1.5:**
            - **New Status Bar Notification Icon**: Replaced old generic cart/bag icon with the custom OskarShop anime gaming character avatar.
            - **Multi-Density Crisp Assets**: Added dedicated `mdpi`, `hdpi`, `xhdpi`, `xxhdpi`, and `xxxhdpi` notification icons with pure alpha-transparency silhouette for perfect status bar rendering on all Android versions.
            - **End-to-End OTA In-App Update Verification**: Tests the in-app self-updating engine (download, progress tracking, and direct package installer).
            - **All 24/7 Features Active**: Dual-capture SMS monitoring (Broadcast + SQLite ContentObserver) and instant order sound alerts running uninterrupted.

            **Installation:**
            1. Existing users on v1.1.4 can simply tap **Update** inside the app.
            2. Or download `OskarSMS-v1.1.5-release.apk` below directly.
          files: |
            release-output/OskarSMS-v1.1.5-release.apk
            release-output/OskarSMS.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
