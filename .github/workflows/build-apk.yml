name: Build & Release OskarSMS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/OskarSMS-v1.1.8-release.apk
          cp app/build/outputs/apk/release/app-release.apk release-output/OskarSMS.apk
          echo "APK successfully built and signed at release-output/OskarSMS-v1.1.8-release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OskarSMS-v1.1.8-APK
          path: release-output/OskarSMS-v1.1.8-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.1.8
          name: "OskarSMS v1.1.8 — Clean Light UI/UX Redesign & 3D Rocket Update Screen"
          body: |
            ### 📱 OskarSMS v1.1.8 — Complete UI/UX Redesign & 3D Rocket Update Screen

            **What's New in v1.1.8:**
            - **Modern Light Theme Redesign**: Vibrant blue gradient System Status card, clean white rounded cards, 3 stat metric tiles (SMS Sent, Matched, Orders).
            - **3D Rocket Update Screen**: Gorgeous 3D illustration, dynamic What's New items with green checkmarks, zero-click package installer.
            - **Dynamic Changelog**: Clean, short feature update lines (1, 3, or more lines dynamically rendered).
            - **Retained App Identity**: Preserved existing Oskar logo and full core verification logic.

            **Installation:**
            1. Existing users on v1.1.7 or earlier will automatically see the 3D rocket update screen on app launch. Tap **Update Now**.
            2. Or download `OskarSMS-v1.1.8-release.apk` below directly.
          files: |
            release-output/OskarSMS-v1.1.8-release.apk
            release-output/OskarSMS.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
