name: Build & Release OskarSMS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/OskarSMS-v1.1.3-release.apk
          cp app/build/outputs/apk/release/app-release.apk release-output/OskarSMS.apk
          echo "APK successfully built and signed at release-output/OskarSMS-v1.1.3-release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OskarSMS-v1.1.3-APK
          path: release-output/OskarSMS-v1.1.3-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.1.3
          name: "OskarSMS v1.1.3 — 100% All-SMS Capture & Compatible Install"
          body: |
            ### 📱 OskarSMS v1.1.3 — 100% All-SMS Capture & Compatible Installation

            **What's New in v1.1.3:**
            - **Fixed Package Installation**: Removed incompatible `android:persistent` system-only flag that caused Android Package Installer to throw "App not installed" on user devices.
            - **Capture 100% of All SMS Messages**: Removed all device-side filters, keyword restrictions, and sender number checks. Captures every incoming SMS from any number, carrier, or source without dropping anything on the phone.
            - **Dual-Capture Architecture**:
              1. **High-Priority Broadcast Receiver** (`priority="999"`) for instant SMS reception.
              2. **SQLite Database ContentObserver** listening directly on `content://sms` to catch incoming SMS as soon as Android writes it to the inbox.
              3. **10-Second Inbox Reconciliation Poller** to ensure zero SMS are missed even during deep Doze / sleep mode.
            - **Full Permissions & Telephony Access**: Full permissions for SMS, Telephony State, Post Notifications, WakeLock, and battery optimization bypass.
            - **24/7 Watchdog Shield & Auto-Resurrection**: Automatically resurrects the service if swiped away from recent apps or killed by aggressive OEM task managers.
            - **Real-Time App Feed**: Every received SMS is displayed in the app's log with instant visual status (`[MATCHED]`, `[RECEIVED]`, `[IGNORED]`, `[FAILED]`).

            **Installation:**
            1. Download `OskarSMS-v1.1.3-release.apk` below directly onto your Android phone.
            2. Tap **Install** (or update).
            3. Grant Full Access permissions, allow Unrestricted Battery, and lock the app in Recent Apps.
          files: |
            release-output/OskarSMS-v1.1.3-release.apk
            release-output/OskarSMS.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
