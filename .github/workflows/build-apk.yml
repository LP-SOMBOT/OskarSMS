name: Build & Release OskarSMS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/OskarSMS-v1.1.6-release.apk
          cp app/build/outputs/apk/release/app-release.apk release-output/OskarSMS.apk
          echo "APK successfully built and signed at release-output/OskarSMS-v1.1.6-release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OskarSMS-v1.1.6-APK
          path: release-output/OskarSMS-v1.1.6-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.1.6
          name: "OskarSMS v1.1.6 — 1xBet Style Forced OTA Screen & Zero-Click Installer"
          body: |
            ### 📱 OskarSMS v1.1.6 — 1xBet Style Forced OTA Screen & Zero-Click Installer

            **What's New in v1.1.6:**
            - **1xBet Style Update UI**: Full-bleed futuristic gaming background, English prompt, "What's new?" expandable sheet, and bottom Update button.
            - **Non-Dismissible (Forced Update)**: No close / X button, back button blocked to ensure staff stay updated.
            - **Automatic Zero-Click Package Installer**: Seamlessly invokes the Android Package Installer immediately upon reaching 100% download without requiring manual clicks.
            - **Instant Launch Discovery**: Automatically triggers check on app launch and resume via high-speed direct endpoint.
            - **Permission On-Click Trigger**: Unknown sources permission prompted only when clicking Update.
            - **Clean Dashboard**: Removed diagnostic clutter rows from the main app interface.
            - **Custom Anime Status Bar Notification Icon**: Gaming character avatar active across all densities.

            **Installation:**
            1. Existing users on v1.1.5 or earlier will automatically see the 1xBet update screen on app launch. Tap **Update**.
            2. Or download `OskarSMS-v1.1.6-release.apk` below directly.
          files: |
            release-output/OskarSMS-v1.1.6-release.apk
            release-output/OskarSMS.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
