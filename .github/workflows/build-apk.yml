name: Build & Release OskarSMS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/OskarSMS-v1.2.2-release.apk
          cp app/build/outputs/apk/release/app-release.apk release-output/OskarSMS.apk
          echo "APK successfully built and signed at release-output/OskarSMS-v1.2.2-release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OskarSMS-v1.2.2-APK
          path: release-output/OskarSMS-v1.2.2-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.2.2
          name: "OskarSMS v1.2.2 — Reliable SMS Forwarding & Durable Admin Sessions"
          body: |
            ### 🛡️ OskarSMS v1.2.2 — Reliable SMS Forwarding & Durable Admin Sessions

            **What's New in v1.2.2:**
            - **Durable Admin Session**: Eliminates 1-hour token expiration so incoming SMS continue forwarding reliably 24/7.
            - **Zero-Redirect Endpoint**: Connects directly to `www.oskarshop.so` without HTTP 307 redirects.
            - **Expanded Carrier Support**: Supports EVC Plus, WAAFI, ZAAD, Sahal, eDahab, Somnet, JEEB, and bank alerts while strictly blocking personal numbers.
            - **Authenticated Order Alerts**: Attaches admin credentials to order polling and retries transient send failures.
          files: |
            release-output/OskarSMS-v1.2.2-release.apk
            release-output/OskarSMS.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
