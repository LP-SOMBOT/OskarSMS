name: Build & Release OskarSMS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/OskarSMS-v1.1.0-release.apk
          cp app/build/outputs/apk/release/app-release.apk release-output/OskarSMS.apk
          echo "APK successfully built and signed at release-output/OskarSMS-v1.1.0-release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OskarSMS-v1.1.0-APK
          path: release-output/OskarSMS-v1.1.0-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.1.0
          name: "OskarSMS v1.1.0 Production Release"
          body: |
            ### 📱 OskarSMS v1.1.0 — Production Release for oskarshop.so

            **What's New in v1.1.0:**
            - **Production Default Endpoint**: Configured directly to connect to `https://oskarshop.so`.
            - **Live New Order Push Notifications**: The admin receives instant heads-up native alerts with sound and vibration whenever a customer places an order on OskarShop, both in the foreground and background!
            - **Order Actions**: Quick actions to jump straight into the Admin Dashboard (`https://oskarshop.so/admin`) or view in OskarSMS.
            - **Order Notification Controls**: New toggle and "Test Order Notification" button to verify sound and vibration anytime.
            - **Smart EVC Plus Verification**: Fully compatible with resilient phone formats, leading zeros, and strict 2-decimal truncation ($1.19999838 -> $1.19).

            **Installation:**
            1. Download `OskarSMS-v1.1.0-release.apk` below directly onto your Android phone.
            2. Open and tap **Install** (or update).
            3. Grant SMS and Notification permissions, and turn the master switch ON.
          files: |
            release-output/OskarSMS-v1.1.0-release.apk
            release-output/OskarSMS.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
