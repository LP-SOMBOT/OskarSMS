name: Build & Release OskarSMS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/OskarSMS-v1.2.3-release.apk
          cp app/build/outputs/apk/release/app-release.apk release-output/OskarSMS.apk
          echo "APK successfully built and signed at release-output/OskarSMS-v1.2.3-release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OskarSMS-v1.2.3-APK
          path: release-output/OskarSMS-v1.2.3-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.2.3
          name: "OskarSMS v1.2.3 — 24/7 Doze Shield & Offline Retry Queue"
          body: |
            ### 🛡️ OskarSMS v1.2.3 — 24/7 Doze Shield & Offline Retry Queue

            **What's New in v1.2.3:**
            - **Persistent Offline Queue**: SMS captured while offline or on slow connections are queued safely and forwarded automatically the instant internet returns.
            - **Deep Sleep / Doze Protection**: WakeLock handoff in `SmsReceiver` + `SCHEDULE_EXACT_ALARM` + 3-minute watchdog + `PendingIntent.getForegroundService` resurrection when closed.
            - **Slow Network Resilience**: Extended HTTP timeouts (`25s` connect / `45s` read) and 2-hour inbox sweep recovery.
          files: |
            release-output/OskarSMS-v1.2.3-release.apk
            release-output/OskarSMS.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
